name: ci

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
      - "**/CHANGELOG.md"
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
      - "**/CHANGELOG.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The root package dominates the suite's wall-clock time: one test
          # binary, strictly serial. It is split across three runners by a
          # deterministic round-robin over the sorted top-level test list, so
          # new tests distribute automatically.
          - shard: root-0
          - shard: root-1
          - shard: root-2
          # Packages that bind ports or spin up cluster members.
          - shard: infra
            packages: "./internal/cluster/... ./internal/dmap/... ./internal/discovery/... ./internal/pubsub/... ./internal/testcluster/..."
          # Everything else. The package list is computed in the run step as
          # the complement of the shards above.
          - shard: core
    env:
      TZ: UTC
      CGO_ENABLED: "1"
      GOTOOLCHAIN: local # avoid auto-upgrading the toolchain
      # Stabilise tests that rely on randomness/time
      GOFLAGS: -mod=readonly

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          check-latest: false
          cache-dependency-path: "**/*.sum"
      - run: go version
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Vendoring and Tidy
        run: go mod tidy && go mod vendor
      - name: Install dependencies
        run: |
          go mod download
      - name: Run tests (${{ matrix.shard }})
        shell: bash
        run: |
          SHARD="${{ matrix.shard }}"
          FLAGS="-mod=vendor -p 1 -timeout 0 -v -race -coverprofile=coverage-${SHARD}.out -covermode=atomic -coverpkg=./..."

          if [[ "$SHARD" == root-* ]]; then
            INDEX="${SHARD#root-}"
            TESTS=$(go test -mod=vendor . -list '^Test' | grep '^Test' | sort | awk -v i="$INDEX" 'NR % 3 == i' | paste -sd'|' -)
            if [ -z "$TESTS" ]; then
              echo "root test slice $INDEX is empty" >&2
              exit 1
            fi
            go test $FLAGS -run "^(${TESTS})$" .
          elif [ "$SHARD" = "core" ]; then
            PACKAGES=$(go list -mod=vendor ./... | grep -v -E "(hasher|internal/bufpool|pkg/flog|pkg/neterrors|pkg/service_discovery)" | grep -v -x "github.com/tochemey/olric" | grep -v -E "/internal/(cluster|dmap|discovery|pubsub|testcluster)(/|$)")
            go test $FLAGS $PACKAGES
          else
            go test $FLAGS ${{ matrix.packages }}
          fi
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-${{ matrix.shard }}.out
          flags: linux
          name: coverage-${{ matrix.shard }}
          fail_ci_if_error: false
          verbose: true
